plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.example.notely'
    compileSdk 35

    defaultConfig {
        // applicationId intentionally stays "com.example.notesapp": the Android
        // data directory is keyed by applicationId, and changing it would orphan
        // the existing notes.json and destroy user notes on upgrade. The Java
        // packages/namespace are fully migrated to com.example.notely instead.
        applicationId "com.example.notesapp"
        minSdk 21
        targetSdk 35
        versionCode 2
        versionName "1.1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
        encoding 'UTF-8'
    }

    // Kotlin/Java interop: keep the default Java source directory and also
    // recognize src/main/kotlin for future Kotlin sources.
    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    buildFeatures {
        buildConfig = true
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }
}

dependencies {
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:2.0.21'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    testImplementation 'junit:junit:4.13.2'
}
